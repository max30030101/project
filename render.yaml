# One-click blueprint for Render.com: web service + PostgreSQL database.
databases:
  - name: fitnesszone-db
    databaseName: fitnesszone
    plan: free

services:
  - type: web
    name: fitness-zone
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn fitnesszone.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SITE_NAME
        value: FITNESS ZONE
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitnesszone-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
